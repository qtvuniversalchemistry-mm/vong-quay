<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vòng quay may mắn | MAINN Media</title>
  <meta name="description" content="Vòng quay may mắn online miễn phí: nhập danh sách tên, quay ngẫu nhiên chọn người trúng thưởng, lưu lịch sử kết quả, toàn màn hình. Công cụ từ MAINN Media.">
  <meta name="theme-color" content="#0a2540">
  <meta property="og:title" content="Vòng quay may mắn | MAINN Media">
  <meta property="og:description" content="Quay ngẫu nhiên chọn người trúng thưởng cho minigame, livestream và sự kiện.">
  <meta property="og:type" content="website">
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/site.js"></script>
</head>
<body data-page="vong-quay">
  <header data-site-header></header>

  <main class="container">
    <div class="tool-head">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../home/">Trang chủ</a><span>/</span><span>Vòng quay may mắn</span></nav>
      <h1>Vòng quay may mắn</h1>
      <p>Nhập mỗi dòng một tên, bấm <strong>QUAY</strong> để chọn ngẫu nhiên.</p>
    </div>

    <div class="wheel-layout">
      <!-- Khu vực vòng quay -->
      <section class="card stage" id="stage" aria-label="Vòng quay">
        <div class="stage__toolbar">
          <button class="btn btn--ghost icon-btn" type="button" id="btnFullscreen" aria-label="Toàn màn hình" title="Toàn màn hình">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>

        <h2 class="stage__title" id="wheelTitle">Vòng quay may mắn</h2>

        <div class="wheel-wrap" id="wheelWrap">
          <svg class="wheel-pointer" id="pointer" viewBox="0 0 44 54" aria-hidden="true">
            <path d="M22 52 L4 14 A18 18 0 1 1 40 14 Z" style="fill:var(--ink)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="22" cy="18" r="6" style="fill:var(--brand)"/>
          </svg>
          <canvas id="wheel" role="img" aria-label="Vòng quay"></canvas>
          <button class="wheel-hub" type="button" id="btnSpin" aria-label="Quay">QUAY</button>
        </div>

        <p class="stage__hint">Bấm vào vòng quay hoặc nhấn <kbd>Ctrl</kbd> + <kbd>Enter</kbd> để quay</p>

        <div class="stage__actions">
          <button class="btn btn--primary" type="button" id="btnSpin2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            Quay ngay
          </button>
          <button class="btn" type="button" id="btnShare">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            Sao chép link chia sẻ
          </button>
        </div>
      </section>

      <!-- Bảng điều khiển -->
      <aside class="card panel" aria-label="Bảng điều khiển">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" type="button" id="tab-list" aria-controls="panel-list" aria-selected="true">Danh sách <span class="count" id="entryCount">0</span></button>
          <button class="tab" role="tab" type="button" id="tab-results" aria-controls="panel-results" aria-selected="false" tabindex="-1">Kết quả <span class="count" id="resultCount">0</span></button>
          <button class="tab" role="tab" type="button" id="tab-settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Cài đặt</button>
        </div>

        <!-- Tab danh sách -->
        <div class="tab-panel" role="tabpanel" id="panel-list" aria-labelledby="tab-list">
          <div class="templates">
            <div class="panel-row">
              <span class="panel-label">Vòng quay mẫu</span>
              <span class="muted">Bấm để dùng ngay</span>
            </div>
            <div class="template-row" id="templateRow" role="group" aria-label="Vòng quay mẫu"></div>
          </div>
          <div class="panel-row">
            <label class="panel-label" for="entries">Mỗi dòng một mục</label>
            <span class="muted" id="entryHint"></span>
          </div>
          <textarea class="entries" id="entries" spellcheck="false" placeholder="Nhập tên, mỗi dòng một tên…"></textarea>
          <div class="chip-row">
            <button class="btn btn--sm" type="button" id="btnShuffle" title="Trộn ngẫu nhiên thứ tự">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Trộn
            </button>
            <button class="btn btn--sm" type="button" id="btnSort" title="Sắp xếp A → Z">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11M3 12h8M3 18h5M17 4v16M14 17l3 3 3-3"/></svg>A → Z
            </button>
            <button class="btn btn--sm" type="button" id="btnDedupe" title="Xóa các dòng trùng nhau">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Xóa trùng
            </button>
            <button class="btn btn--sm" type="button" id="btnImport" title="Nhập từ file .txt hoặc .csv">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Nhập file
            </button>
            <button class="btn btn--sm btn--ghost" type="button" id="btnClear" title="Xóa toàn bộ danh sách">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Xóa hết
            </button>
            <input type="file" id="fileInput" accept=".txt,.csv,text/plain,text/csv" hidden>
          </div>
        </div>

        <!-- Tab kết quả -->
        <div class="tab-panel" role="tabpanel" id="panel-results" aria-labelledby="tab-results" hidden>
          <div class="panel-row">
            <span class="panel-label">Lịch sử kết quả</span>
            <span class="muted">Mới nhất ở trên</span>
          </div>
          <ol class="results" id="results"></ol>
          <div class="chip-row">
            <button class="btn btn--sm" type="button" id="btnCopyResults">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Sao chép
            </button>
            <button class="btn btn--sm" type="button" id="btnExportResults">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Tải file Excel (CSV)
            </button>
            <button class="btn btn--sm btn--ghost" type="button" id="btnClearResults">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Xóa lịch sử
            </button>
          </div>
        </div>

        <!-- Tab cài đặt -->
        <div class="tab-panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
          <div class="field">
            <label for="setTitle">Tiêu đề vòng quay</label>
            <input class="input" id="setTitle" maxlength="80" placeholder="VD: Minigame livestream tối thứ 6">
          </div>

          <div class="field">
            <label for="setDuration">Thời gian quay</label>
            <div class="range-row">
              <input type="range" id="setDuration" min="2" max="20" step="1">
              <output id="durationOut" for="setDuration">6 giây</output>
            </div>
          </div>

          <div class="field">
            <span class="field__label">Bảng màu</span>
            <div class="palette-grid" id="paletteGrid"></div>
          </div>

          <div>
            <label class="switch">
              <span class="switch__text"><strong>Tự động xóa người trúng</strong><span>Loại mục vừa trúng khỏi danh sách sau mỗi lượt</span></span>
              <input type="checkbox" id="setAutoRemove"><span class="switch__ui"></span>
            </label>
            <label class="switch">
              <span class="switch__text"><strong>Âm thanh</strong><span>Tiếng tích tắc khi quay và nhạc khi có kết quả</span></span>
              <input type="checkbox" id="setSound"><span class="switch__ui"></span>
            </label>
            <label class="switch">
              <span class="switch__text"><strong>Pháo giấy</strong><span>Hiệu ứng ăn mừng khi có người trúng</span></span>
              <input type="checkbox" id="setConfetti"><span class="switch__ui"></span>
            </label>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Hộp thoại người trúng -->
  <dialog class="winner-dialog" id="winnerDialog" aria-labelledby="winnerName">
    <div class="winner-dialog__top">
      <div class="winner-dialog__label">🎉 Chúc mừng</div>
      <p class="winner-dialog__name" id="winnerName"></p>
    </div>
    <div class="winner-dialog__body">
      <p class="winner-dialog__meta" id="winnerMeta"></p>
      <div class="winner-dialog__actions">
        <button class="btn btn--primary" type="button" id="btnSpinAgain">Quay tiếp</button>
        <button class="btn" type="button" id="btnRemoveWinner">Xóa khỏi danh sách</button>
        <button class="btn" type="button" id="btnCloseWinner">Đóng</button>
      </div>
    </div>
  </dialog>

  <footer data-site-footer></footer>

  <script src="../assets/js/wheel.js"></script>
</body>
</html>
